# בונה את גרסת ה-PWA ופורס אותה ל-GitHub Pages בכל דחיפה.
# configure-pages עם enablement: true מפעיל את Pages בריפו אם הוא עדיין כבוי.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mobile-app-training-videos-0s2j8m
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פריסה אחת בכל רגע; ריצה חדשה לא מבטלת פריסה שכבר רצה
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: התקנת תלויות
        run: npm ci

      - name: הגדרת Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: בניית ה-PWA
        # base_path מגיע מ-configure-pages ומתאים לכתובת שבה האתר מוגש
        run: node scripts/build-pwa.js --base "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
